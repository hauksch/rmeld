[workspace]
resolver = "3"
members = ["crates/rmeld", "crates/rmeld-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false # crates.io publication is a separate, later decision

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.41"
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = "thin"
